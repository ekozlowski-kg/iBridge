name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  node:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --omit=dev --ignore-scripts --no-audit --no-fund
      - run: npm test
